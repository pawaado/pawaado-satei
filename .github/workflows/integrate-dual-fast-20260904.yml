name: Integrate dual attack into optimizer
on:
  push:
    paths:
      - '.github/workflows/integrate-dual-fast-20260904.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Patch integrated dual optimizer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          WVER='20260904-integrated-dual-1'
          AVER='20260904-integrated-dual-1'

          p=Path('pawaado_worker.js')
          s=p.read_text()

          anchor="const D=window.PAWAADO_DATA;\nconst expNames=['筋力','敏捷','技術','知力','精神'];"
          insert="""const D=window.PAWAADO_DATA;
const ACADEMY_MASTER=D.academyMaster||{academies:[]};
const BOOTRAIN_MASTER=(ACADEMY_MASTER.academies||[]).find(a=>a.name==='ブートレインアカデミー')||null;
const DUAL_MASTER=BOOTRAIN_MASTER?.dualAttack||null;
const DUAL_SKILL_INDEX=DUAL_MASTER?D.special.findIndex(s=>String(s[1])===String(DUAL_MASTER.skillName)):-1;
let workerDualEnabled=false;
let workerDualLevel=Number(DUAL_MASTER?.initialLevel||1);
let workerDualHint=0;
self.__PAWAADO_INTEGRATED_DUAL__=true;
const expNames=['筋力','敏捷','技術','知力','精神'];"""
          if anchor not in s: raise SystemExit('top anchor not found')
          s=s.replace(anchor,insert,1)

          old="function mixedStateKey(st){\n  return key(st.cost)+'|'+mixedLevelsKey(st.levels)+'|'+bitsKey(st.bits??EMPTY_BITS);\n}"
          new="function mixedStateKey(st){\n  return key(st.cost)+'|'+mixedLevelsKey(st.levels)+'|'+bitsKey(st.bits??EMPTY_BITS)+'|d'+(st.dualLevel==null?'':Number(st.dualLevel).toString(36));\n}"
          if old not in s: raise SystemExit('mixedStateKey anchor not found')
          s=s.replace(old,new,1)

          marker="""function mixedSpecialActionsAtHp(st,exp,hp){"""
          dual_func="""function mixedDualAction(st,exp){
  if(!workerDualEnabled||!DUAL_MASTER||DUAL_SKILL_INDEX<0) return null;
  const fromLevel=Number(st.dualLevel??workerDualLevel);
  const toLevel=fromLevel+1;
  if(toLevel>Number(DUAL_MASTER.maxLevel||fromLevel)) return null;
  const def=DUAL_MASTER.levels?.[toLevel];
  if(!def) return null;

  const dexIndex=basicNames.indexOf('器用さ');
  const currentDex=Number(st.levels[dexIndex]||1);
  const reqDex=Number(def.reqDex||0);
  let targetDex=currentDex;
  let cost=(def.cost||[0,0,0,0,0]).map(v=>costAfter(Number(v||0),workerDualHint,false));
  let gain=Number(def.score||0);
  const items=[];

  if(currentDex<reqDex){
    const dexOp=mixedBasicOption('器用さ',currentDex,reqDex);
    if(!dexOp) return null;
    cost=addCost(cost,dexOp.cost);
    gain+=Number(dexOp.score||0);
    items.push(...(dexOp.items||EMPTY_ITEMS));
    targetDex=reqDex;
  }

  const finalCost=addCost(st.cost,cost);
  if(!leq(finalCost,exp)) return null;
  items.push({type:'special',idx:DUAL_SKILL_INDEX,name:`${DUAL_MASTER.skillName} Lv${toLevel}`,dualLevel:toLevel});
  const cs=costSum(cost);
  return {
    kind:'dual',
    name:`${DUAL_MASTER.skillName} Lv${toLevel}`,
    fromLevel,
    toLevel,
    toDex:targetDex,
    cost,
    costSum:cs,
    gain,
    score:gain,
    efficiency:gain/Math.max(1,cs),
    items,
    bits:EMPTY_BITS
  };
}

"""
          if marker not in s: raise SystemExit('dual function marker not found')
          s=s.replace(marker,dual_func+marker,1)

          old="""  const normalActions=basicActions.concat(currentSpecials.filter(op=>!op.isHpDependent));
  normalActions.sort(mixedActionSort);"""
          new="""  const normalActions=basicActions.concat(currentSpecials.filter(op=>!op.isHpDependent));
  const dualAction=mixedDualAction(st,exp);
  if(dualAction) normalActions.push(dualAction);
  normalActions.sort(mixedActionSort);"""
          if old not in s: raise SystemExit('candidate action anchor not found')
          s=s.replace(old,new,1)

          old="""  let life=st.life;
  let bits=st.bits??EMPTY_BITS;

  if(op.kind==='basic'){"""
          new="""  let life=st.life;
  let bits=st.bits??EMPTY_BITS;
  let dualLevel=st.dualLevel;

  if(op.kind==='basic'){"""
          if old not in s: raise SystemExit('apply action vars anchor not found')
          s=s.replace(old,new,1)

          old="""  }else if(op.kind==='life_hp_set'){
    levels[0]=op.to;
    life=op.to;
    bits|=(op.bits??specialItemsBits(op.items));
  }else{
    bits|=(op.bits??specialItemsBits(op.items));
  }

  return {
    cost:nc,
    score:Math.round((Number(st.score||0)+Number(op.gain||0))*10)/10,
    life,
    levels,
    bits,"""
          new="""  }else if(op.kind==='life_hp_set'){
    levels[0]=op.to;
    life=op.to;
    bits|=(op.bits??specialItemsBits(op.items));
  }else if(op.kind==='dual'){
    const dexIndex=basicNames.indexOf('器用さ');
    if(Number(op.toDex)>Number(levels[dexIndex])) levels[dexIndex]=Number(op.toDex);
    dualLevel=Number(op.toLevel);
  }else{
    bits|=(op.bits??specialItemsBits(op.items));
  }

  return {
    cost:nc,
    score:Math.round((Number(st.score||0)+Number(op.gain||0))*10)/10,
    life,
    levels,
    bits,
    dualLevel,"""
          if old not in s: raise SystemExit('apply action branch anchor not found')
          s=s.replace(old,new,1)

          old="""  const init={
    cost:[0,0,0,0,0],score:0,life:initialLife,levels,
    bits:EMPTY_BITS,prev:null,choice:EMPTY_ITEMS,itemLen:0,usedCost:0
  };"""
          new="""  const init={
    cost:[0,0,0,0,0],score:0,life:initialLife,levels,
    bits:EMPTY_BITS,dualLevel:workerDualEnabled?workerDualLevel:null,
    prev:null,choice:EMPTY_ITEMS,itemLen:0,usedCost:0
  };"""
          if old not in s: raise SystemExit('init anchor not found')
          s=s.replace(old,new,1)

          old="""      const maxGain=actions.reduce((m,o)=>!m||o.gain>m.gain?o:m,null);
      if(maxGain&&!selected.includes(maxGain)) selected.push(maxGain);

      for(const op of selected){"""
          new="""      const maxGain=actions.reduce((m,o)=>!m||o.gain>m.gain?o:m,null);
      if(maxGain&&!selected.includes(maxGain)) selected.push(maxGain);
      // 双剣士通常攻撃は器用さ条件込みの専用候補として必ず比較対象に残す。
      const dualChoice=actions.find(o=>o.kind==='dual');
      if(dualChoice&&!selected.includes(dualChoice)) selected.push(dualChoice);

      for(const op of selected){"""
          if old not in s: raise SystemExit('selected anchor not found')
          s=s.replace(old,new,1)

          old="""function __workerPayloadConfigKey(payload){
  const basicPart=basicNames.map(name=>["""
          new="""function __workerPayloadConfigKey(payload){
  const dualPart=[
    payload.isDualSwordsman?1:0,
    Number(payload.dualAttackLevel||DUAL_MASTER?.initialLevel||1),
    Number(payload.dualAttackHint||0)
  ];
  const basicPart=basicNames.map(name=>["""
          if old not in s: raise SystemExit('payload key start not found')
          s=s.replace(old,new,1)

          old="""  return JSON.stringify([
    String(payload.academy||''),
    String(payload.job||''),
    basicPart,
    specialPart
  ]);"""
          new="""  return JSON.stringify([
    String(payload.academy||''),
    String(payload.job||''),
    dualPart,
    basicPart,
    specialPart
  ]);"""
          if old not in s: raise SystemExit('payload key return not found')
          s=s.replace(old,new,1)

          old="""function __applyWorkerPayload(payload){
  const nextConfigKey=__workerPayloadConfigKey(payload);
  const configChanged=nextConfigKey!==__workerConfigKey;

  if(configChanged){"""
          new="""function __applyWorkerPayload(payload){
  workerDualEnabled=!!payload.isDualSwordsman || (
    String(payload.academy||'')===String(BOOTRAIN_MASTER?.name||'') &&
    String(payload.job||'')===String(DUAL_MASTER?.internalJob||'')
  );
  workerDualLevel=Math.max(Number(DUAL_MASTER?.initialLevel||1),Math.min(Number(DUAL_MASTER?.maxLevel||1),Number(payload.dualAttackLevel||DUAL_MASTER?.initialLevel||1)));
  workerDualHint=Math.max(0,Math.min(5,Number(payload.dualAttackHint||0)));
  const nextConfigKey=__workerPayloadConfigKey(payload);
  const configChanged=nextConfigKey!==__workerConfigKey;

  if(configChanged){"""
          if old not in s: raise SystemExit('apply payload anchor not found')
          s=s.replace(old,new,1)

          # Add result collapse helper before worker onmessage.
          marker="""self.onmessage=async(event)=>{"""
          helper="""function collapseDualResultItems(items){
  if(!workerDualEnabled||!DUAL_MASTER) return items;
  const dualItems=(items||[]).filter(it=>it?.type==='special'&&Number.isFinite(Number(it.dualLevel)));
  if(!dualItems.length) return items;
  const levels=dualItems.map(it=>Number(it.dualLevel)).sort((a,b)=>a-b);
  const first=levels[0],last=levels[levels.length-1];
  const label=first===last?`Lv${last}`:`Lv${first}→Lv${last}`;
  const combined={type:'special',idx:DUAL_SKILL_INDEX,name:`${DUAL_MASTER.skillName} ${label}`};
  const out=[];
  let inserted=false;
  for(const item of items||[]){
    if(item?.type==='special'&&Number.isFinite(Number(item.dualLevel))){
      if(!inserted){out.push(combined);inserted=true;}
      continue;
    }
    out.push(item);
  }
  return out;
}

"""
          if marker not in s: raise SystemExit('worker message marker not found')
          s=s.replace(marker,helper+marker,1)

          old="""    const finalCandidate=await optimizeMixedAsync(exp,null);
    const items=restoreItems(finalCandidate).map(item=>({...item}));"""
          new="""    if(workerDualEnabled&&DUAL_MASTER&&workerDualLevel>Number(DUAL_MASTER.initialLevel||1)){
      const dex=Number(payload.basicValues?.['器用さ']||1);
      const req=Number(DUAL_MASTER.levels?.[workerDualLevel]?.reqDex||0);
      if(dex<req) throw new Error(`取得条件を満たしていません（通常攻撃Lv${workerDualLevel}には器用さ${req}以上が必要です）。`);
    }
    const finalCandidate=await optimizeMixedAsync(exp,null);
    const items=collapseDualResultItems(restoreItems(finalCandidate).map(item=>({...item})));"""
          if old not in s: raise SystemExit('final candidate anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s)

          # academy_runtime: integrated workerなら旧6回ループを通さずbase workerへ直行。
          p=Path('academy_runtime.js')
          a=p.read_text()
          old="""    global.onmessage=async(event)=>{
      const data=event.data||{};"""
          new="""    global.onmessage=async(event)=>{
      if(global.__PAWAADO_INTEGRATED_DUAL__) return baseHandler(event);
      const data=event.data||{};"""
          if old not in a: raise SystemExit('runtime worker handler anchor not found')
          a=a.replace(old,new,1)
          a=re.sub(r'pawaado_worker\\.js\\?v=[^\'\"]+',f'pawaado_worker.js?v={WVER}',a)
          a=re.sub(r'academy_runtime\\.js\\?v=[^\'\"]+',f'academy_runtime.js?v={AVER}',a)
          # Native iOSメニューで1行に収まれば1行。収まらない時は語の途中ではなくここで折れるよう空白を置く。
          a=a.replace("return plain==='タテレスキュアアカデミー'?'タテレスキュア\\u2060アカデミー':plain;",
                      "return plain==='タテレスキュアアカデミー'?'タテレスキュア アカデミー':plain;")
          p.write_text(a)

          p=Path('index.html')
          i=p.read_text()
          i=re.sub(r'academy_runtime\\.js\\?v=[^\"]+',f'academy_runtime.js?v={AVER}',i)
          p.write_text(i)
          PY
      - name: Syntax checks
        run: |
          node --check pawaado_worker.js
          node --check academy_runtime.js
      - name: Regression and benchmark
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const academySrc=fs.readFileSync('academy_runtime.js','utf8');
          function makeCtx(){
            const ctx={console,setTimeout,clearTimeout,Promise,Map,Set,BigInt,Math,Number,String,Array,Object,JSON,Date,Error,RegExp,Uint32Array,Float64Array};
            ctx.self=ctx;ctx.globalThis=ctx;ctx.window=ctx;ctx.performance={now:()=>Date.now()};ctx._posts=[];ctx.postMessage=m=>ctx._posts.push(m);
            vm.createContext(ctx);
            ctx.importScripts=(...urls)=>{for(const u of urls){const f=String(u).split('?')[0].replace(/^\.\//,'');vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:f});}};
            vm.runInContext(academySrc,ctx,{filename:'academy_runtime.js'});
            return ctx;
          }
          async function run(payload,label){
            const ctx=makeCtx();const t=Date.now();await ctx.onmessage({data:{type:'calculate',payload}});const ms=Date.now()-t;
            const msg=ctx._posts.at(-1);if(!msg||msg.type!=='result')throw new Error(label+' '+JSON.stringify(msg));
            console.log(label,'ms=',ms,'score=',msg.result.score,'cost=',msg.result.cost.join(','),'remain=',payload.exp.map((v,i)=>v-msg.result.cost[i]).join(','));
            console.log(label,'items=',msg.result.items.map(x=>x.type==='basic'?`${x.name} ${x.from}->${x.to}`:x.name).join(' / '));
            return msg.result;
          }
          (async()=>{
            const hints={生命力:0,パワー:0,魔力:0,器用さ:0,耐久力:0,精神力:0};
            const r1=await run({academy:'ブートレインアカデミー',job:'双剣士',exp:[500,300,500,0,0],basicValues:{生命力:110,パワー:115,魔力:60,器用さ:70,耐久力:100,精神力:95},basicOwned:{生命力:true,パワー:true,魔力:true,器用さ:true,耐久力:true,精神力:true},basicHints:hints,specialState:[],dualAttackLevel:1,dualAttackHint:0,isDualSwordsman:true},'SMALL');
            if(Number(r1.score)!==1000||!r1.items.some(x=>String(x.name).includes('通常攻撃(双剣士) Lv2'))) throw new Error('small regression failed');
            const bigPayload={academy:'ブートレインアカデミー',job:'双剣士',exp:[1300,1200,1400,1300,1200],basicValues:{生命力:110,パワー:115,魔力:60,器用さ:80,耐久力:100,精神力:95},basicOwned:{生命力:true,パワー:true,魔力:true,器用さ:false,耐久力:true,精神力:true},basicHints:hints,specialState:[],dualAttackLevel:1,dualAttackHint:0,isDualSwordsman:true};
            const r2=await run(bigPayload,'BIG');
            if(Number(r2.score)<3877) throw new Error('big score regressed '+r2.score);
            if(!r2.items.some(x=>String(x.name).includes('通常攻撃(双剣士) Lv2'))) throw new Error('big dual Lv2 missing');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit integrated optimizer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pawaado_worker.js academy_runtime.js index.html
          git diff --cached --quiet || git commit -m '双剣士通常攻撃を一体探索して計算を高速化'
          git push
