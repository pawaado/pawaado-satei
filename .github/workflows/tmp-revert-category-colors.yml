name: tmp-revert-category-colors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-revert-category-colors.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revert category colors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('style.css')
          s=p.read_text(encoding='utf-8')
          block1='''\n\n/* category-color-preview-20260916 */\n/* 通常の特殊能力はゲーム画面を意識した淡い水色。取得済みの緑表示は従来どおり。 */\n.skill-row:not(.owned){\n  border-color:#4e8290;\n  background:#d7edf2;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 2px 3px rgba(45,92,105,.14);\n}\n.skill-row:not(.owned) .name-btn{\n  background:linear-gradient(180deg,#f0fbfc,#cce8ee);\n  color:#27434c;\n}\n'''
          block2='''\n\n/* skill-plus-blue-20260916 */\n/* 特殊能力の未取得行は水色系で統一。左の＋も同系色にして茶金との混在感をなくす。 */\n.skill-row:not(.owned) .hint-btn{\n  border-right-color:#4e8290;\n  color:#f4fdff;\n  background:linear-gradient(180deg,#5f9eac,#376f7d);\n  text-shadow:0 1px 0 #234a55;\n}\n'''
          s=s.replace(block1,'').replace(block2,'')
          p.write_text(s,encoding='utf-8')

          p=Path('rankings.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('tr.basic td.name-cell{background:#fff1c7;color:#5a3c10}','tr.basic td.name-cell{background:#e7f4fa;color:#285269}',1)
          s=s.replace('tr.special td.name-cell{background:#dff1f6;color:#285a68}','tr.special td.name-cell{background:#fff3cf;color:#5a3c10}',1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('style.css?v=20260916-category-colors-2','style.css?v=20260916-design-revert-1',1)
          s=s.replace('style.css?v=20260916-category-colors-1','style.css?v=20260916-design-revert-1',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css rankings.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Restore original category colors'
            git push
          fi
