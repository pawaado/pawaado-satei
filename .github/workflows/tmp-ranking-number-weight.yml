name: tmp-ranking-number-weight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-ranking-number-weight.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emphasize ranking numeric columns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rankings.html')
          s=p.read_text(encoding='utf-8')
          old='td:nth-child(3),td:nth-child(4),td:nth-child(5){text-align:right;font-variant-numeric:tabular-nums}'
          new='td:nth-child(3),td:nth-child(4),td:nth-child(5){text-align:right;font-variant-numeric:tabular-nums;font-weight:700}\n    td:nth-child(3){font-weight:800}'
          if old not in s:
              raise SystemExit('target CSS not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rankings.html
          git commit -m 'Emphasize ranking numeric columns'
          git push
