name: Make dual swordsman independent
on:
  push:
    paths:
      - '.github/workflows/make-dual-swordsman-independent.yml'
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message != 'cleanup: remove dual swordsman migration workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace archer alias with real dual swordsman job
        shell: python
        run: |
          from pathlib import Path

          # data.js: ブートレインの双剣士を独立ジョブ名で保持する
          p=Path('data.js')
          s=p.read_text()
          s=s.replace('// ブートレインの内部名「弓使い」は、画面上では「双剣士」と表示します。','// ブートレインの双剣士は独立ジョブとして登録。')
          old='''    [\n      "ブートレインアカデミー",\n      "弓使い",\n      110,\n      115,\n      60,\n      120,\n      100,\n      95\n    ],'''
          new='''    [\n      "ブートレインアカデミー",\n      "双剣士",\n      110,\n      115,\n      60,\n      120,\n      100,\n      95\n    ],'''
          if old not in s:
            raise SystemExit('ブートレイン双剣士の academies 行が見つかりません')
          s=s.replace(old,new,1)
          if '"internalJob": "弓使い"' not in s:
            raise SystemExit('dualAttack.internalJob が見つかりません')
          s=s.replace('"internalJob": "弓使い"','"internalJob": "双剣士"',1)
          p.write_text(s)

          # script.js: 双剣士を正式な物理職として扱う
          p=Path('script.js')
          s=p.read_text()
          if "'双剣士':'job-dual'" not in s:
            s=s.replace("  '弓使い':'job-archer',\n", "  '弓使い':'job-archer',\n  '双剣士':'job-dual',\n", 1)
          s=s.replace("['剣士','弓使い','重戦士'].includes(job.value)", "['剣士','弓使い','重戦士','双剣士'].includes(job.value)")
          p.write_text(s)

          # Worker側も同じく双剣士を正式な物理職として扱う
          p=Path('pawaado_worker.js')
          s=p.read_text()
          s=s.replace("importScripts('./data.js');", "importScripts('./data.js?v=20260904-dual-job-1');", 1)
          s=s.replace("['剣士','弓使い','重戦士'].includes(job.value)", "['剣士','弓使い','重戦士','双剣士'].includes(job.value)")
          p.write_text(s)

          # runtimeのWorkerキャッシュを更新
          p=Path('academy_runtime.js')
          s=p.read_text()
          s=s.replace("./pawaado_worker.js?v=academy-runtime-base-20260904-2", "./pawaado_worker.js?v=20260904-dual-job-1")
          s=s.replace("./academy_runtime.js?v=20260904-3", "./academy_runtime.js?v=20260904-dual-job-1")
          p.write_text(s)

          # ブラウザキャッシュ更新
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('data.js?v=20260904-organized-2','data.js?v=20260904-dual-job-1')
          s=s.replace('academy_runtime.js?v=20260904-organized-2','academy_runtime.js?v=20260904-dual-job-1')
          s=s.replace('script.js?v=academy-runtime-v1','script.js?v=20260904-dual-job-1')
          p.write_text(s)

      - name: Validate changes
        shell: bash
        run: |
          node --check script.js
          node --check pawaado_worker.js
          node --check academy_runtime.js
          node - <<'NODE'
          const fs=require('fs');
          global.window={};
          eval(fs.readFileSync('data.js','utf8'));
          const D=window.PAWAADO_DATA;
          const row=D.academies.find(r=>r[0]==='ブートレインアカデミー' && r[1]==='双剣士');
          if(!row) throw new Error('ブートレイン/双剣士が academies にありません');
          if(D.academies.some(r=>r[0]==='ブートレインアカデミー' && r[1]==='弓使い')) throw new Error('ブートレインに弓使い偽装が残っています');
          const dual=D.academyMaster?.academies?.find(a=>a.name==='ブートレインアカデミー')?.dualAttack;
          if(dual?.internalJob!=='双剣士') throw new Error('dualAttack.internalJob が双剣士ではありません');
          const special=D.special[D.special.length-1];
          if(special?.[1]!=='通常攻撃(双剣士)') throw new Error('特殊能力末尾が通常攻撃(双剣士)ではありません');
          console.log('dual swordsman data validation OK');
          NODE
          grep -q "'双剣士':'job-dual'" script.js
          grep -q "\['剣士','弓使い','重戦士','双剣士'\]" script.js
          grep -q "\['剣士','弓使い','重戦士','双剣士'\]" pawaado_worker.js

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js script.js pawaado_worker.js academy_runtime.js index.html
          git commit -m '双剣士を独立ジョブとして正式登録'
          git push
