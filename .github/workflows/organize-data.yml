name: Finalize data organization
on:
  push:
    paths:
      - '.github/workflows/organize-data.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump browser cache and remove temporary workflow
        run: |
          sed -i 's/data.js?v=20260904-single-source-1/data.js?v=20260904-organized-2/' index.html
          sed -i 's/academy_runtime.js?v=20260904-single-source-1/academy_runtime.js?v=20260904-organized-2/' index.html
          git rm .github/workflows/organize-data.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'data.js整理後のキャッシュ更新'
          git push
