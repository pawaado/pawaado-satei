name: Check forced dual Lv2
on:
  push:
    paths:
      - '.github/workflows/check-force-dual-lv2-20260904.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare free vs forced Lv2
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          function makeCtx(){
            const ctx={console,setTimeout,clearTimeout,Promise,Map,Set,BigInt,Math,Number,String,Array,Object,JSON,Date,Error,RegExp,Uint32Array,Float64Array};
            ctx.self=ctx;ctx.globalThis=ctx;ctx.window=ctx;ctx.performance={now:()=>Date.now()};ctx._posts=[];ctx.postMessage=m=>ctx._posts.push(m);
            vm.createContext(ctx);
            ctx.importScripts=(...urls)=>{for(const u of urls){const f=String(u).split('?')[0].replace(/^\.\//,'');vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:f});}};
            vm.runInContext(fs.readFileSync('pawaado_worker.js','utf8'),ctx,{filename:'pawaado_worker.js'});
            return ctx;
          }
          async function run(payload,label){
            const ctx=makeCtx(); const t=Date.now();
            await ctx.onmessage({data:{type:'calculate',payload}});
            const msg=ctx._posts.at(-1); if(!msg||msg.type!=='result') throw new Error(label+': '+JSON.stringify(msg));
            console.log(label,'ms=',Date.now()-t,'score=',msg.result.score,'cost=',msg.result.cost.join(','));
            console.log(label,'items=',msg.result.items.map(x=>x.name+(x.type==='basic'?` ${x.from}->${x.to}`:'')).join(' / '));
            return {ctx,result:msg.result};
          }
          const basics={生命力:50,パワー:50,魔力:50,器用さ:50,耐久力:50,精神力:50};
          const owned={生命力:false,パワー:false,魔力:false,器用さ:false,耐久力:false,精神力:false};
          const hints={生命力:0,パワー:0,魔力:0,器用さ:0,耐久力:0,精神力:0};
          const base={academy:'ブートレインアカデミー',job:'双剣士',basicValues:basics,basicOwned:owned,basicHints:hints,specialState:[],isDualSwordsman:true,dualAttackLevel:1,dualAttackHint:0};
          (async()=>{
            const original=[1200,1200,1300,1000,1000];
            const free=await run({...base,exp:original},'FREE');
            const D=free.ctx.PAWAADO_DATA;
            function range(row,v){const m=String(row[0]).match(/(\d+)→(\d+)/);return m&&v>=+m[1]&&v<+m[2];}
            let dexCost=[0,0,0,0,0],dexScore=0;
            for(let v=50;v<60;v++){
              const cr=D.dexCost.find(r=>range(r,v)); const sr=D.dexScore.find(r=>range(r,v));
              if(!cr||!sr) throw new Error('dex row missing '+v);
              for(let i=0;i<5;i++) dexCost[i]+=Number(cr[i+1]||0);
              dexScore+=Number(sr[2]||0);
            }
            const dualCost=D.academyMaster.academies.find(a=>a.name==='ブートレインアカデミー').dualAttack.levels['2'].cost.map(Number);
            const dualScore=Number(D.academyMaster.academies.find(a=>a.name==='ブートレインアカデミー').dualAttack.levels['2'].score);
            const mandatory=dexCost.map((v,i)=>v+dualCost[i]);
            const remain=original.map((v,i)=>v-mandatory[i]);
            console.log('MANDATORY dexCost=',dexCost.join(','),'dexScore=',dexScore,'dualCost=',dualCost.join(','),'dualScore=',dualScore,'remain=',remain.join(','));
            if(remain.some(v=>v<0)) throw new Error('Lv2 cannot be forced with this exp');
            const forcedPayload={...base,exp:remain,basicValues:{...basics,器用さ:60},dualAttackLevel:2};
            const forced=await run(forcedPayload,'AFTER_LV2');
            const total=Number(forced.result.score)+dexScore+dualScore;
            console.log('FORCED_TOTAL=',total,'difference_vs_free=',total-Number(free.result.score));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
