name: Apply dual stack patch
on:
  push:
    paths:
      - 'tools/dual_stack_patch.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python tools/dual_stack_patch.py
          node --check academy_runtime.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add academy_runtime.js index.html
          git diff --cached --quiet || git commit -m '双剣士通常攻撃をLv別の段階表示に変更'
          git push
