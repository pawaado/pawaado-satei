name: Check Bootrain optimality and label
on:
  push:
    paths:
      - '.github/workflows/check-bootrain-opt-20260904.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fix TateRescue label fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('academy_runtime.js')
          s=p.read_text()
          old="function noWrapAcademyLabel(text){const plain=String(text||'').replace(/\\u2060/g,'');return plain==='タテレスキュアアカデミー'?'タテレスキュア\\u2060アカデミー':plain;}"
          new="function noWrapAcademyLabel(text){const plain=String(text||'').replace(/\\u2060/g,'');return plain==='タテレスキュアアカデミー'?'タテレスキュア アカデミー':plain;}"
          if old not in s:
              raise SystemExit('label anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          
          p=Path('index.html')
          s=p.read_text()
          import re
          s=re.sub(r'academy_runtime\\.js\\?v=[^\"]+','academy_runtime.js?v=20260904-taterescue-label-1',s)
          p.write_text(s)
          PY
      - name: Benchmark current and wider search
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const academySrc=fs.readFileSync('academy_runtime.js','utf8');
          const baseSrc=fs.readFileSync('pawaado_worker.js','utf8');

          function makeWide(src){
            return src
              .replace('const MIXED_BRANCH_NORMAL=7;','const MIXED_BRANCH_NORMAL=14;')
              .replace('const baseLimit=Math.max(2800,Math.min(7600,1900+Math.floor(totalExp*0.95)));',
                       'const baseLimit=Math.max(12000,Math.min(26000,6000+Math.floor(totalExp*2.8)));');
          }

          async function runCase(label,workerSrc){
            const ctx={console,setTimeout,clearTimeout,Promise,Map,Set,BigInt,Math,Number,String,Array,Object,JSON,Date,Error,RegExp,Uint32Array,Float64Array};
            ctx.self=ctx;ctx.globalThis=ctx;ctx.window=ctx;ctx.performance={now:()=>Date.now()};ctx._posts=[];ctx.postMessage=m=>ctx._posts.push(m);
            vm.createContext(ctx);
            ctx.importScripts=(...urls)=>{for(const u of urls){const f=String(u).split('?')[0].replace(/^\.\//,'');const src=f==='pawaado_worker.js'?workerSrc:fs.readFileSync(f,'utf8');vm.runInContext(src,ctx,{filename:f});}};
            vm.runInContext(academySrc,ctx,{filename:'academy_runtime.js'});
            const basics={生命力:110,パワー:115,魔力:60,器用さ:80,耐久力:100,精神力:95};
            const owned={生命力:true,パワー:true,魔力:true,器用さ:false,耐久力:true,精神力:true};
            const hints={生命力:0,パワー:0,魔力:0,器用さ:0,耐久力:0,精神力:0};
            const payload={academy:'ブートレインアカデミー',job:'双剣士',exp:[1300,1200,1400,1300,1200],basicValues:basics,basicOwned:owned,basicHints:hints,specialState:[],dualAttackLevel:1,dualAttackHint:0,isDualSwordsman:true};
            const t=Date.now();
            await ctx.onmessage({data:{type:'calculate',payload}});
            const ms=Date.now()-t;
            const msg=ctx._posts.at(-1);
            if(!msg||msg.type!=='result') throw new Error(label+' failed '+JSON.stringify(msg));
            console.log(label,'ms=',ms,'score=',msg.result.score,'cost=',msg.result.cost.join(','),'remain=',payload.exp.map((v,i)=>v-msg.result.cost[i]).join(','));
            console.log(label,'items=',msg.result.items.map(x=>x.type==='basic'?`${x.name} ${x.from}->${x.to}`:x.name).join(' / '));
            return msg.result;
          }

          (async()=>{
            const normal=await runCase('CURRENT',baseSrc);
            const wide=await runCase('WIDE',makeWide(baseSrc));
            console.log('SCORE_DIFF',Number(wide.score)-Number(normal.score));
            if(Number(wide.score)<Number(normal.score)) throw new Error('wide result unexpectedly worse');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Syntax check
        run: |
          node --check academy_runtime.js
          node --check pawaado_worker.js
      - name: Commit label fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add academy_runtime.js index.html
          git diff --cached --quiet || git commit -m 'タテレスキュアの選択肢表示を調整'
          git push
