name: tmp-category-colors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-category-colors.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply category colors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Main tool: make unowned special abilities a soft game-like aqua.
          p=Path('style.css')
          s=p.read_text(encoding='utf-8')
          marker='/* category-color-preview-20260916 */'
          block='''\n\n/* category-color-preview-20260916 */\n/* 通常の特殊能力はゲーム画面を意識した淡い水色。取得済みの緑表示は従来どおり。 */\n.skill-row:not(.owned){\n  border-color:#4e8290;\n  background:#d7edf2;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 2px 3px rgba(45,92,105,.14);\n}\n.skill-row:not(.owned) .name-btn{\n  background:linear-gradient(180deg,#f0fbfc,#cce8ee);\n  color:#27434c;\n}\n'''
          if marker not in s:
              s += block
          p.write_text(s,encoding='utf-8')

          # Bust the stylesheet cache on the main page.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('style.css?v=20260904-academy-menu-1','style.css?v=20260916-category-colors-1')
          p.write_text(s,encoding='utf-8')

          # Ranking: basic abilities = gold family, special abilities = blue family.
          p=Path('rankings.html')
          s=p.read_text(encoding='utf-8')
          old_basic='tr.basic td.name-cell{background:#e7f4fa;color:#285269}'
          old_special='tr.special td.name-cell{background:#fff3cf;color:#5a3c10}'
          new_basic='tr.basic td.name-cell{background:#fff1c7;color:#5a3c10}'
          new_special='tr.special td.name-cell{background:#dff1f6;color:#285a68}'
          if old_basic in s:
              s=s.replace(old_basic,new_basic,1)
          if old_special in s:
              s=s.replace(old_special,new_special,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css index.html rankings.html
          if ! git diff --cached --quiet; then
            git commit -m 'Apply category color preview'
            git push
          fi
