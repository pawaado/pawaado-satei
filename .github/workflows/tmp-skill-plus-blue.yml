name: tmp-skill-plus-blue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-skill-plus-blue.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make special ability plus button blue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('style.css')
          s=p.read_text(encoding='utf-8')
          marker='/* skill-plus-blue-20260916 */'
          block='''\n\n/* skill-plus-blue-20260916 */\n/* 特殊能力の未取得行は水色系で統一。左の＋も同系色にして茶金との混在感をなくす。 */\n.skill-row:not(.owned) .hint-btn{\n  border-right-color:#4e8290;\n  color:#f4fdff;\n  background:linear-gradient(180deg,#5f9eac,#376f7d);\n  text-shadow:0 1px 0 #234a55;\n}\n'''
          if marker not in s:
              s += block
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('style.css?v=20260916-category-colors-1','style.css?v=20260916-category-colors-2')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css index.html
          git commit -m 'Align special ability plus button color'
          git push
