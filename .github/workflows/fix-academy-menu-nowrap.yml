name: Fix academy menu nowrap
on:
  push:
    paths:
      - '.github/workflows/fix-academy-menu-nowrap.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Keep academy labels on one line and left aligned
        shell: python
        run: |
          from pathlib import Path
          import re

          # iPhoneのネイティブselectメニューで長いアカデミー名が改行されないように、
          # 表示ラベルへ不可視のWord Joinerを入れる。option.valueは変更しない。
          p=Path('academy_runtime.js')
          s=p.read_text()
          anchor="""    function academyEl(){return document.getElementById('academy');}\n    function jobEl(){return document.getElementById('job');}\n"""
          repl="""    function academyEl(){return document.getElementById('academy');}\n    function jobEl(){return document.getElementById('job');}\n    function noWrapAcademyLabel(text){return String(text||'').replace(/\\u2060/g,'').split('').join('\\u2060');}\n    function syncAcademyOptionLabels(){\n      const a=academyEl();\n      if(!a) return;\n      for(const option of a.options){\n        if(!option.value) continue;\n        const label=noWrapAcademyLabel(option.value);\n        if(option.textContent!==label) option.textContent=label;\n      }\n    }\n"""
          if anchor not in s:
            raise SystemExit('academyEl anchor not found')
          s=s.replace(anchor,repl,1)

          s=s.replace("      syncJobLabel();syncTheme();\n", "      syncAcademyOptionLabels();syncJobLabel();syncTheme();\n", 1)
          s=s.replace("      setTimeout(()=>{syncJobLabel();syncTheme();renderDualRow();},0);", "      setTimeout(()=>{syncAcademyOptionLabels();syncJobLabel();syncTheme();renderDualRow();},0);")
          s=s.replace("    syncJobLabel();syncTheme();renderDualRow();", "    syncAcademyOptionLabels();syncJobLabel();syncTheme();renderDualRow();", 1)
          s=s.replace("./academy_runtime.js?v=20260904-dual-freeze-1", "./academy_runtime.js?v=20260904-academy-menu-1")
          p.write_text(s)

          # ネイティブメニュー側でも収まりやすいようにアカデミーだけ少し小さくし、左揃えを明示。
          p=Path('style.css')
          s=p.read_text()
          css="""
/* アカデミー選択肢：iPhoneのネイティブメニューでも長い名称を1行・左揃えで表示 */
#academy,#academy option{font-size:15px;text-align:left}
#academy option{white-space:nowrap}
"""
          if css.strip() not in s:
            s += '\n' + css
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'style\.css\?v=[^\"]+', 'style.css?v=20260904-academy-menu-1', s)
          s=re.sub(r'academy_runtime\.js\?v=[^\"]+', 'academy_runtime.js?v=20260904-academy-menu-1', s)
          p.write_text(s)

      - name: Syntax check
        run: |
          node --check academy_runtime.js
          grep -q "syncAcademyOptionLabels" academy_runtime.js
          grep -q "#academy,#academy option" style.css
          grep -q "academy_runtime.js?v=20260904-academy-menu-1" index.html
          grep -q "style.css?v=20260904-academy-menu-1" index.html

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add academy_runtime.js style.css index.html
          git commit -m 'アカデミー選択肢を1行左揃えに調整'
          git push
