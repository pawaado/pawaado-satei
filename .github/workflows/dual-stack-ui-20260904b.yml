name: Stack dual attack level UI v2
on:
  push:
    paths:
      - '.github/workflows/dual-stack-ui-20260904b.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python -c "import base64;exec(base64.b64decode('<SECRET>'))"
          node --check academy_runtime.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add academy_runtime.js index.html
          git diff --cached --quiet || git commit -m '双剣士通常攻撃をLv別の段階表示に変更'
          git push
