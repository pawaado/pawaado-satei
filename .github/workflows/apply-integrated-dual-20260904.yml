name: Apply integrated dual optimizer
on:
  push:
    paths:
      - '.github/workflows/apply-integrated-dual-20260904.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/integrated_dual_patch_20260904.py
      - name: Syntax checks
        run: |
          node --check pawaado_worker.js
          node --check academy_runtime.js
      - name: Regression benchmark
        run: node tools/test_integrated_dual_20260904.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pawaado_worker.js academy_runtime.js index.html
          git diff --cached --quiet || git commit -m '双剣士通常攻撃を一体探索して計算を高速化'
          git push
# rerun 2
