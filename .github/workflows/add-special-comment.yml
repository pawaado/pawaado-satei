name: Add special data comment
on:
  push:
    paths:
      - '.github/workflows/add-special-comment.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add comment before special data
        shell: python
        run: |
          from pathlib import Path
          p=Path('data.js')
          s=p.read_text()
          marker='  "special": [\n'
          comment=(
            '  // 特殊能力データの列順\n'
            '  // [No, 能力名, 前提能力, 筋力, 敏捷, 技術, 知力, 精神, 物理職査定, 魔法職査定, 僧侶査定, HP依存率, 物理職固定加算, 魔法職固定加算, 僧侶固定加算, 注記]\n'
            '  // 物理職査定：剣士・重戦士・弓使い・双剣士\n'
            '  // 魔法職査定：魔闘士・魔法使い\n'
            '  // 例）魔法攻撃○の「135」は魔法職査定、「13」は僧侶査定。\n'
          )
          if comment in s:
            print('comment already exists')
          else:
            if marker not in s:
              raise SystemExit('special marker not found')
            s=s.replace(marker,comment+marker,1)
            p.write_text(s)
      - name: Syntax check
        run: node --check data.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js
          git diff --cached --quiet || git commit -m '特殊能力データの列説明コメントを追加'
          git push
