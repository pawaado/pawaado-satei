name: tmp-benchmark
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bench:
    if: ${{ !contains(github.event.head_commit.message, 'Remove temporary benchmark') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install selenium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/pawaado-http.log 2>&1 &
          sleep 1
          python3 tmp_benchmark.py
