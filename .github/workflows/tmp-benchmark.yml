name: tmp-benchmark
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bench:
    if: ${{ !contains(github.event.head_commit.message, 'Remove temporary benchmark') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '=== optimizer functions ==='
          grep -nE 'function .*([Oo]pt|mixed|prune|candidate)|const .*([Oo]pt|mixed|prune|candidate)' pawaado_worker.js | head -n 200 || true
          echo '=== async/search references ==='
          grep -nE 'optimize|mixedCandidate|prune|beam|upper|state|candidate' pawaado_worker.js | tail -n 260 || true
