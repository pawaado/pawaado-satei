name: tmp-benchmark
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bench:
    if: ${{ !contains(github.event.head_commit.message, '[skip-bench]') && !contains(github.event.head_commit.message, 'Remove temporary benchmark') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install selenium
      - run: |
          cp pawaado_worker.js /tmp/pawaado_worker.base.js
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/pawaado-http.log 2>&1 &
          sleep 1
          VARIANT=baseline python3 tmp_precision_benchmark.py
          cp /tmp/pawaado_worker.base.js pawaado_worker.js
          python3 tmp_variant_patch.py
          VARIANT=optimized python3 tmp_precision_benchmark.py
      - name: Apply verified optimizer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pawaado_worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply verified optimizer speedup [skip-bench]"
          git push origin HEAD:main
