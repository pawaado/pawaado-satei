name: Fix dual attack and Bootrain exp limits
on:
  push:
    paths:
      - '.github/workflows/fix-dual-exp-ui-20260904.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          VERSION='20260904-dual-expfix-1'
          WORKER_VERSION='20260904-exp1400-1'

          # -------------------------
          # index.html
          # -------------------------
          p=Path('index.html')
          s=p.read_text()

          # 今回追加した列車・ハンマー・救助アイコンを完全に削除。
          s=re.sub(
              r'\n\s*/\* 選択中アカデミーのシンボル。.*?@media\(max-width:370px\)\{.*?\n\s*\}\n',
              '\n', s, count=1, flags=re.S
          )
          s=s.replace('      <span id="academySymbol" class="academy-symbol" aria-hidden="true"></span>\n','')
          marker="""  <script>\n    (function(){\n      const academy=document.getElementById('academy');\n      const symbol=document.getElementById('academySymbol');"""
          start=s.find(marker)
          if start>=0:
              end=s.find('  </script>',start)
              if end<0:
                  raise SystemExit('academy symbol inline script end not found')
              end += len('  </script>')
              s=s[:start]+s[end:]

          # キャッシュ更新。
          s=re.sub(r'academy_runtime\.js\?v=[^\"]+', f'academy_runtime.js?v={VERSION}', s)
          s=re.sub(r'script\.js\?v=[^\"]+', f'script.js?v={VERSION}', s)
          p.write_text(s)

          # -------------------------
          # academy_runtime.js
          # -------------------------
          p=Path('academy_runtime.js')
          s=p.read_text()

          # pawaado_worker.js が fake document を作るため、import後に document の有無で
          # Worker判定をやり直すと false になっていた。起動時の判定を保持する。
          old="const isWorker=(typeof document==='undefined' && typeof global.importScripts==='function');"
          if old not in s:
              raise SystemExit('academy runtime isWorker anchor not found')
          s=s.replace(old,'const isWorker=__academyWorkerBoot;',1)

          # Worker本体のキャッシュも更新。
          s=re.sub(r'pawaado_worker\.js\?v=[^\'\"]+', f'pawaado_worker.js?v={WORKER_VERSION}', s)

          # タテレスキュアは改行しやすい境目だけ Word Joiner で結ぶ。
          # 全文字間に入れる方式はiOSで最後の「ー」だけ折り返すことがあったため廃止。
          s=re.sub(
              r"function noWrapAcademyLabel\(text\)\{[^\n]*\}",
              "function noWrapAcademyLabel(text){const plain=String(text||'').replace(/\\u2060/g,'');return plain==='タテレスキュアアカデミー'?'タテレスキュア\\u2060アカデミー':plain;}",
              s, count=1
          )

          # Lv6取得済みを再タップしたらLv6だけ解除（Lv5所持状態へ戻る）。
          old="""    function tryAcquireNext(){\n      if(dualLevel>=DUAL.maxLevel) return;\n      const next=dualLevel+1;"""
          new="""    function tryAcquireNext(){\n      if(dualLevel>=DUAL.maxLevel){\n        setDualLevel(DUAL.maxLevel-1);\n        return;\n      }\n      const next=dualLevel+1;"""
          if old not in s:
              raise SystemExit('dual acquire anchor not found')
          s=s.replace(old,new,1)
          # 取得済でもボタンとして再タップできることをARIA上も明示。
          s=s.replace("label.setAttribute('aria-disabled',maxed?'true':'false');","label.setAttribute('aria-disabled','false');",1)

          # WrappedWorker側のacademy_runtime自身のキャッシュも更新。
          s=re.sub(r'academy_runtime\.js\?v=[^\'\"]+', f'academy_runtime.js?v={VERSION}', s)
          p.write_text(s)

          # -------------------------
          # script.js
          # -------------------------
          p=Path('script.js')
          s=p.read_text()

          # アカデミー別経験点上限。ブートレインだけ上限拡張。
          anchor="""const academy=document.getElementById('academy');\nconst job=document.getElementById('job');"""
          insert="""const academy=document.getElementById('academy');\nconst job=document.getElementById('job');\nconst DEFAULT_EXP_LIMIT=1000;\nconst BOOTRAIN_EXP_LIMITS={筋力:1300,敏捷:1200,技術:1400,知力:1300,精神:1200};\nfunction expLimit(name){\n  return academy?.value==='ブートレインアカデミー'\n    ? Number(BOOTRAIN_EXP_LIMITS[name]||DEFAULT_EXP_LIMIT)\n    : DEFAULT_EXP_LIMIT;\n}"""
          if anchor not in s:
              raise SystemExit('academy/job anchor not found')
          s=s.replace(anchor,insert,1)

          # アカデミー変更時にmax属性・エラー表示も即更新。
          old="academy.addEventListener('change',updateJobs);"
          new="academy.addEventListener('change',()=>{updateJobs();renderExp();validateAllInline();});"
          if old not in s:
              raise SystemExit('academy change listener anchor not found')
          s=s.replace(old,new,1)

          # 複製/追加ボタンの有効判定。
          old="return Number.isFinite(num) && num>=0 && num<=1000;"
          new="return Number.isFinite(num) && num>=0 && num<=expLimit(name);"
          if old not in s:
              raise SystemExit('isExpSampleReady anchor not found')
          s=s.replace(old,new,1)

          # HTML input自体のmax値。
          old='max="1000" id="exp_${index}_${safeId(name)}"'
          new='max="${expLimit(name)}" id="exp_${index}_${safeId(name)}"'
          if old not in s:
              raise SystemExit('renderExp max anchor not found')
          s=s.replace(old,new,1)

          # インライン経験点エラー。
          old="""    const num=Number(v);\n    if(!Number.isFinite(num) || num<0) msg='経験点は0以上の値を入力してください';\n    else if(num>1000) msg='経験点は1000以下の値を入力してください';"""
          new="""    const num=Number(v);\n    const max=expLimit(name);\n    if(!Number.isFinite(num) || num<0) msg='経験点は0以上の値を入力してください';\n    else if(num>max) msg=`経験点は${max}以下の値を入力してください`;"""
          if old not in s:
              raise SystemExit('validateExpField anchor not found')
          s=s.replace(old,new,1)

          # 計算開始時の経験点エラー。
          old="""      const num=Number(v);\n      if(!Number.isFinite(num) || num<0) expErrs.push(`${sampleErrorPrefix(index)}${n}経験点は0以上の値を入力してください。`);\n      if(num>1000) expErrs.push(`${sampleErrorPrefix(index)}${n}経験点は1000以下の値を入力してください。`);"""
          new="""      const num=Number(v);\n      const max=expLimit(n);\n      if(!Number.isFinite(num) || num<0) expErrs.push(`${sampleErrorPrefix(index)}${n}経験点は0以上の値を入力してください。`);\n      if(num>max) expErrs.push(`${sampleErrorPrefix(index)}${n}経験点は${max}以下の値を入力してください。`);"""
          if old not in s:
              raise SystemExit('validateInputs exp anchor not found')
          s=s.replace(old,new,1)

          old="if(!values.every(v=>Number.isFinite(v) && v>=0 && v<=1000)) return null;"
          new="if(!values.every((v,i)=>Number.isFinite(v) && v>=0 && v<=expLimit(expNames[i]))) return null;"
          if old not in s:
              raise SystemExit('validSampleValues anchor not found')
          s=s.replace(old,new,1)

          # 上限値が1000以外でもエラーボックスの改行を同じ見た目にする。
          pattern=r"function formatErrorMessage\(message\)\{.*?\n\}\nfunction renderErrorBox"
          repl="""function formatErrorMessage(message){\n  const text=String(message??'');\n  if(/\\d+以下の値を入力してください。/.test(text)){\n    return text.replace(\n      /(\\d+以下の値を)入力してください。/g,\n      '$1<br><span class=\"error-no-break\">入力してください。</span>'\n    );\n  }\n  return text.replace(\n    /入力してください。/g,\n    '<span class=\"error-no-break\">入力してください。</span>'\n  );\n}\nfunction renderErrorBox"""
          s,n=re.subn(pattern,repl,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('formatErrorMessage block not found')

          # 1000超の経験点を扱うため状態キーの基数を1501へ。最大1400でも衝突せずSafe Integer内。
          old="function key5(c0,c1,c2,c3,c4){\n  return String(((((c0*1001+c1)*1001+c2)*1001+c3)*1001+c4));\n}"
          new="function key5(c0,c1,c2,c3,c4){\n  return String(((((c0*1501+c1)*1501+c2)*1501+c3)*1501+c4));\n}"
          if old not in s:
              raise SystemExit('script key5 anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # -------------------------
          # pawaado_worker.js
          # -------------------------
          p=Path('pawaado_worker.js')
          s=p.read_text()
          old="function key5(c0,c1,c2,c3,c4){\n  return String(((((c0*1001+c1)*1001+c2)*1001+c3)*1001+c4));\n}"
          new="function key5(c0,c1,c2,c3,c4){\n  return String(((((c0*1501+c1)*1501+c2)*1501+c3)*1501+c4));\n}"
          if old not in s:
              raise SystemExit('worker key5 anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

      - name: Static checks
        run: |
          node --check script.js
          node --check academy_runtime.js
          node --check pawaado_worker.js
          grep -q "const isWorker=__academyWorkerBoot" academy_runtime.js
          grep -q "setDualLevel(DUAL.maxLevel-1)" academy_runtime.js
          grep -q "筋力:1300,敏捷:1200,技術:1400,知力:1300,精神:1200" script.js
          grep -q "c0\*1501" script.js
          grep -q "c0\*1501" pawaado_worker.js
          ! grep -q "academySymbol" index.html
          ! grep -q "const train=" index.html
          grep -q "タテレスキュア\\u2060アカデミー" academy_runtime.js
      - name: Dual worker regression test
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const ctx={console,setTimeout,clearTimeout,Promise,Map,Set,BigInt,Math,Number,String,Array,Object,JSON,Date,Error,RegExp,Uint32Array,Float64Array};
          ctx.self=ctx; ctx.globalThis=ctx; ctx.window=ctx;
          ctx.performance={now:()=>Date.now()};
          ctx._posts=[];
          ctx.postMessage=(m)=>ctx._posts.push(m);
          vm.createContext(ctx);
          ctx.importScripts=(...urls)=>{
            for(const u of urls){
              const file=String(u).split('?')[0].replace(/^\.\//,'');
              vm.runInContext(fs.readFileSync(file,'utf8'),ctx,{filename:file});
            }
          };
          vm.runInContext(fs.readFileSync('academy_runtime.js','utf8'),ctx,{filename:'academy_runtime.js'});
          if(typeof ctx.onmessage!=='function') throw new Error('academy runtime worker handler missing');
          const basics={生命力:110,パワー:115,魔力:60,器用さ:70,耐久力:100,精神力:95};
          const owned={生命力:true,パワー:true,魔力:true,器用さ:true,耐久力:true,精神力:true};
          const hints={生命力:0,パワー:0,魔力:0,器用さ:0,耐久力:0,精神力:0};
          (async()=>{
            await ctx.onmessage({data:{type:'calculate',payload:{
              academy:'ブートレインアカデミー',job:'双剣士',
              exp:[500,300,500,0,0],basicValues:basics,basicOwned:owned,basicHints:hints,
              specialState:[],dualAttackLevel:1,dualAttackHint:0,isDualSwordsman:true
            }}});
            const msg=ctx._posts.at(-1);
            if(!msg||msg.type!=='result') throw new Error('dual calc did not return result: '+JSON.stringify(msg));
            const score=Number(msg.result?.score||0);
            const names=(msg.result?.items||[]).map(x=>String(x.name||''));
            if(score<1000) throw new Error('dual Lv2 score missing: '+score+' / '+names.join(','));
            if(!names.some(n=>n.includes('通常攻撃(双剣士) Lv2'))) throw new Error('dual Lv2 item missing: '+names.join(','));
            console.log('dual regression OK',score,names.join(' / '));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html academy_runtime.js script.js pawaado_worker.js
          git diff --cached --quiet || git commit -m '双剣士計算とブートレイン経験点上限を修正'
          git push
