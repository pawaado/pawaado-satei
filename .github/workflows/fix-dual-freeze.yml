name: Fix dual swordsman freeze
on:
  push:
    paths:
      - '.github/workflows/fix-dual-freeze.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fix observer loop
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('academy_runtime.js')
          s=p.read_text()
          old="if(specialList) observer.observe(specialList,{childList:true,subtree:true});"
          new="// specialList直下の再描画だけを監視する。subtree監視は双剣士行自身の更新を拾って無限ループになるため使わない。\n    if(specialList) observer.observe(specialList,{childList:true});"
          if old not in s: raise SystemExit('observer block not found')
          s=s.replace(old,new,1)
          old_label="label.innerHTML=`<span class=\"dual-level-text\"><span>${DUAL.skillName}</span><span class=\"dual-level-badge\">Lv${shownLevel}</span></span>${maxed?'<span class=\"owned-label\">✓取得済</span>':''}`;"
          new_label="const labelHtml=`<span class=\"dual-level-text\"><span>${DUAL.skillName}</span><span class=\"dual-level-badge\">Lv${shownLevel}</span></span>${maxed?'<span class=\"owned-label\">✓取得済</span>':''}`;\n        if(label.innerHTML!==labelHtml) label.innerHTML=labelHtml;"
          if old_label not in s: raise SystemExit('label assignment not found')
          s=s.replace(old_label,new_label,1)
          s=s.replace("'./academy_runtime.js?v=20260904-dual-job-1'", "'./academy_runtime.js?v=20260904-dual-freeze-1'")
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'academy_runtime\.js\?v=[^\"]+', 'academy_runtime.js?v=20260904-dual-freeze-1', s)
          p.write_text(s)
      - name: Syntax check
        run: |
          node --check academy_runtime.js
          grep -q "observer.observe(specialList,{childList:true});" academy_runtime.js
          grep -q "labelHtml" academy_runtime.js
          grep -q "academy_runtime.js?v=20260904-dual-freeze-1" index.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add academy_runtime.js index.html
          git commit -m '双剣士選択時のフリーズを修正'
          git push
